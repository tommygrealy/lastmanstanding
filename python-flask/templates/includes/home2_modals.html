<div class="modal-backdrop hidden" data-modal-backdrop></div>

<div id="selectionModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="selectionTitle">
    <h3 id="selectionTitle">Your Selection</h3>
    <p id="csTeamWin"></p>
    <div class="modal-actions">
        <button type="button" id="submitNow" class="lms-btn">Submit</button>
        <button type="button" id="submitCancel" class="lms-btn">Cancel</button>
    </div>
</div>

<div id="noticeModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="noticeTitle">
    <h3 id="noticeTitle"></h3>
    <p id="noticeBody"></p>
    <div class="modal-actions">
        <button type="button" id="noticeConfirm" class="lms-btn">OK</button>
        <button type="button" id="noticeSecondary" class="lms-btn hidden"></button>
    </div>
</div>

<div id="historyModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
    <h3 id="historyTitle">History</h3>
    <div id="userHistoryList" class="card-container"></div>
    <div class="modal-actions">
        <button type="button" id="historyClose" class="lms-btn">Close</button>
    </div>
</div>

<div id="dynamiteModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="dynamiteTitle">
    <h3 id="dynamiteTitle">Drop Dynamite</h3>
    <p id="dynamiteAction"></p>
    <div class="modal-actions">
        <button type="button" id="submitDynamiteNow" class="lms-btn">YES</button>
        <button type="button" id="submitDynamiteCancel" class="lms-btn">NO</button>
    </div>
</div>
